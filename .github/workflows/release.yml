name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLET_VERSION: "0.86.5"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Install DMG tool
        run: brew install create-dmg
      - name: Build macOS App
        run: |
          flet build macos \
            --module-name main.py \
            --product Spectrum \
            --build-version "${{ env.VERSION }}" \
            --yes
      - name: Package DMG (Robust)
        shell: bash
        run: |
          mkdir -p release
          # 动态搜索生成的 .app 目录
          APP_PATH=$(find build/macos -name "Spectrum.app" -type d | head -n 1)
          if [[ -z "$APP_PATH" ]]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [[ -z "$APP_PATH" ]]; then
            echo "ERROR: Could not find any .app bundle in build directory!" >&2
            find build || true
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          
          # 确保根目录或 build/macos/ 下有统一入口供脚本调用，同时直接使用 create-dmg
          mkdir -p build/macos/Build/Products/Release
          cp -R "$APP_PATH" "build/macos/Build/Products/Release/" 2>/dev/null || true
          cp -R "$APP_PATH" "build/macos/" 2>/dev/null || true
          cp -R "$APP_PATH" "." 2>/dev/null || true
          
          if [ -f scripts/make_dmg.sh ]; then
            bash scripts/make_dmg.sh "${VERSION}" || {
              echo "make_dmg.sh failed, falling back to direct create-dmg..."
              create-dmg \
                --volname "Spectrum" \
                --window-pos 200 120 \
                --window-size 800 400 \
                --icon-size 100 \
                --icon "Spectrum.app" 200 190 \
                --hide-extension "Spectrum.app" \
                --app-drop-link 600 185 \
                "release/Spectrum-${VERSION}-macos.dmg" \
                "$APP_PATH"
            }
          else
            create-dmg \
              --volname "Spectrum" \
              --window-pos 200 120 \
              --window-size 800 400 \
              --icon-size 100 \
              --icon "Spectrum.app" 200 190 \
              --hide-extension "Spectrum.app" \
              --app-drop-link 600 185 \
              "release/Spectrum-${VERSION}-macos.dmg" \
              "$APP_PATH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build Windows app
        run: flet build windows --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}" --yes
      - name: Zip portable EXE (PowerShell)
        shell: powershell
        run: |
          mkdir release -Force
          $exe = Get-ChildItem -Path build/windows -Filter "Spectrum.exe" -Recurse | Select-Object -First 1
          if ($exe -eq $null) {
            Write-Error "Spectrum.exe not found"
            exit 1
          }
          $dir = $exe.Directory.FullName
          $zipFile = "release/Spectrum-$env:VERSION-windows.zip"
          Compress-Archive -Path "$dir\*" -DestinationPath $zipFile -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip

  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build Linux
        run: flet build linux --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}" --yes
      - name: Pack tarball
        shell: bash
        run: |
          mkdir -p release
          APP_DIR="build/linux/app"
          if [[ -d "$APP_DIR" ]]; then
            (cd "$APP_DIR" && tar -czf "$GITHUB_WORKSPACE/release/Spectrum-${VERSION}-linux.tar.gz" .)
          else
            (cd build/linux && tar -czf "$GITHUB_WORKSPACE/release/Spectrum-${VERSION}-linux.tar.gz" .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: release/*.tar.gz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Prepare requirements for mobile
        shell: bash
        run: |
          # 关键：避免根目录 requirements.txt 干扰 Android site-packages 安装
          if [ -f requirements.txt ]; then
            echo "Backing up requirements.txt for Android build"
            mv requirements.txt requirements.txt.bak
          fi
          # 生成仅包含纯运行时依赖的空文件（Flet 核心会由 serious_python 自动注入）
          touch requirements.txt
      - name: Build APK
        run: |
          flet clean || true
          flet build apk \
            --module-name main.py \
            --product Spectrum \
            --build-version "${{ env.VERSION }}" \
            --python-version 3.12 \
            --arch arm64-v8a \
            --yes
      - name: Restore requirements
        if: always()
        shell: bash
        run: |
          if [ -f requirements.txt.bak ]; then
            mv requirements.txt.bak requirements.txt
          fi
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          APK=$(find build -name '*.apk' | head -n1)
          if [[ -n "$APK" ]]; then
            echo "Found APK: $APK"
            cp "$APK" "release/Spectrum-${VERSION}-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: release/*.apk

  publish:
    name: GitHub Release
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && always() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten Artifacts
        run: |
          mkdir -p upload
          find dist -type f -exec cp {} upload/ \;
          ls -lh upload
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          draft: false