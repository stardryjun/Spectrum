name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLET_VERSION: "0.86.5"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Install macOS build deps
        run: |
          brew install create-dmg
          brew install gtk+3 || echo "gtk+3 not needed, continuing"
      - name: Build macOS App
        run: |
          flet build macos \
            --module-name main.py \
            --product Spectrum \
            --build-version "${{ env.VERSION }}" \
            --yes
      - name: Verify & List build output
        run: |
          echo "Listing build/macos:"
          find build/macos -maxdepth 3 || true
      - name: Make DMG
        run: bash scripts/make_dmg.sh "${{ env.VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build Windows app
        run: flet build windows --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}" --yes
      - name: Zip portable EXE (PowerShell)
        shell: powershell
        run: |
          mkdir release -Force
          $exe = Get-ChildItem -Path build/windows -Filter "Spectrum.exe" -Recurse | Select-Object -First 1
          if ($exe -eq $null) {
            Write-Error "Spectrum.exe not found"
            exit 1
          }
          $dir = $exe.Directory.FullName
          $zipFile = "release/Spectrum-$env:VERSION-windows.zip"
          Compress-Archive -Path "$dir\*" -DestinationPath $zipFile -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip

  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build Linux
        run: flet build linux --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}" --yes
      - name: Pack tarball
        shell: bash
        run: |
          mkdir -p release
          APP_DIR="build/linux/app"
          if [[ -d "$APP_DIR" ]]; then
            (cd "$APP_DIR" && tar -czf "$GITHUB_WORKSPACE/release/Spectrum-${VERSION}-linux.tar.gz" .)
          else
            (cd build/linux && tar -czf "$GITHUB_WORKSPACE/release/Spectrum-${VERSION}-linux.tar.gz" .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: release/*.tar.gz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    continue-on-error: true # 关键：避免 Android 试验性卡点阻塞桌面三端发布
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install flet==${{ env.FLET_VERSION }}
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Build APK (arm64-v8a only)
        run: |
          flet clean || true
          flet build apk \
            --module-name main.py \
            --product Spectrum \
            --build-version "${{ env.VERSION }}" \
            --target-arch arm64-v8a \
            --yes
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          APK=$(find build -name '*.apk' | head -n1)
          if [[ -n "$APK" ]]; then
            cp "$APK" "release/Spectrum-${VERSION}-android.apk"
          else
            echo "Warning: APK not generated."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: release/*.apk

  publish:
    name: GitHub Release
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && always() && needs.macos.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten Artifacts
        run: |
          mkdir -p upload
          find dist -type f -exec cp {} upload/ \;
          ls -lh upload
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          draft: false