# Build one-click installers and attach them to a GitHub Release.
#
# Trigger:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Outputs:
#   Spectrum-<ver>-macos.dmg
#   Spectrum-<ver>-windows.zip   (contains Spectrum.exe)
#   Spectrum-<ver>-android.apk
#   Spectrum-<ver>-linux.tar.gz

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLET_VERSION: "0.86.5"

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install "flet[all]==${{ env.FLET_VERSION }}"
      - name: Build .app
        run: flet build macos --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}"
      - name: Make DMG
        run: bash scripts/make_dmg.sh "" "${{ env.VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install "flet[all]==${{ env.FLET_VERSION }}"
      - name: Build Windows app
        run: flet build windows --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}"
      - name: Zip portable EXE
        shell: bash
        run: |
          mkdir -p release
          SRC="$(find build/windows -iname 'Spectrum.exe' | head -n1)"
          if [[ -z "$SRC" ]]; then
            echo "Spectrum.exe not found" >&2
            find build -name '*.exe' | head
            exit 1
          fi
          DIR="$(dirname "$SRC")"
          (cd "$DIR" && zip -r "$GITHUB_WORKSPACE/release/Spectrum-${VERSION}-windows.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install "flet[all]==${{ env.FLET_VERSION }}"
      - name: Build APK
        run: flet build apk --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}"
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          APK="$(find build -name '*.apk' | head -n1)"
          cp "$APK" "release/Spectrum-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk

  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Install Flet
        run: pip install "flet[all]==${{ env.FLET_VERSION }}"
      - name: Build Linux
        run: flet build linux --module-name main.py --product Spectrum --build-version "${{ env.VERSION }}"
      - name: Pack
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/Spectrum-${VERSION}-linux.tar.gz" -C build/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: release/*.tar.gz

  publish:
    name: GitHub Release
    needs: [macos, windows, android, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p upload
          find dist -type f -exec cp {} upload/ \;
          ls -lh upload
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          draft: false
